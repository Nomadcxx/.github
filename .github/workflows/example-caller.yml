name: Go verification example

on:
  pull_request:
    paths:
      - MATRIX.md
      - matrix/**
      - go.mod
      - go.sum
      - .github/workflows/example-caller.yml
      - .github/workflows/go-verify.yml
  push:
    paths:
      - MATRIX.md
      - matrix/**
      - go.mod
      - go.sum
      - .github/workflows/example-caller.yml
      - .github/workflows/go-verify.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    uses: Nomadcxx/.github/.github/workflows/go-verify.yml@cd88b2e0b04be9dee5a2becf3a4586b108dd9c11
    with:
      go-version-file: go.mod
      run-build: true
      extra-setup: false
      timeout: 20
