name: Matrix audit

on:
  pull_request:
    paths:
      - MATRIX.md
      - matrix/**
      - scripts/check-matrix-live.sh
      - go.mod
      - .github/workflows/matrix-audit.yml
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

jobs:
  matrix:
    name: matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version-file: go.mod
      - run: go test ./matrix
      - run: scripts/check-matrix-live.sh
