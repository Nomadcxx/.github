name: Go verification

on:
  workflow_call:
    inputs:
      go-version-file:
        description: Path to the Go module file that selects the toolchain.
        required: true
        type: string
      run-build:
        description: Build all packages after verification.
        required: false
        default: false
        type: boolean
      extra-setup:
        description: Run the caller repository's fixed native setup action.
        required: false
        default: false
        type: boolean
      timeout:
        description: Job timeout in minutes.
        required: false
        default: 20
        type: number

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version-file: ${{ inputs.go-version-file }}
      - if: ${{ inputs.extra-setup }}
        uses: ./.github/actions/ci-setup
      - name: Check gofmt
        shell: bash
        run: |
          unformatted="$(gofmt -l .)"
          if [[ -n "$unformatted" ]]; then
            printf '%s\n' "$unformatted"
            exit 1
          fi
      - name: Run go vet
        run: go vet ./...
      - name: Run race tests
        run: go test -race -count=1 ./...
      - if: ${{ inputs.run-build }}
        name: Build packages
        run: go build ./...
